[project]
name = "daily_brief_engine"
version = "0.1.0"
description = "daily-brief-engine using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.5"
]

[project.scripts]
daily_brief_engine = "daily_brief_engine.main:run"
run_crew = "daily_brief_engine.main:run"
train = "daily_brief_engine.main:train"
replay = "daily_brief_engine.main:replay"
test = "daily_brief_engine.main:test"
run_with_trigger = "daily_brief_engine.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
